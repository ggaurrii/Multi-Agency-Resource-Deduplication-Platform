services:
  db:
    image: postgis/postgis:15-3.4
    container_name: sahayog_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahayog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahayog_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sahayog}
    ports:
      - "5432:5432"
    volumes:
      - sahayog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahayog} -d ${POSTGRES_DB:-sahayog}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahayog_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  sahayog_pgdata:
